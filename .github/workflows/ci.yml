name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run codegen:check
      - run: pnpm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p test-results
      - run: pnpm test:unit
      - name: Print test report
        if: always()
        run: pnpm --filter @workspace/scripts run print-test-report -- unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/unit.xml
          if-no-files-found: ignore

  api-tests:
    name: API & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      SESSION_SECRET: ci-test-secret-key-12345
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run push
      - run: pnpm --filter @workspace/scripts run seed-rbac
      - run: mkdir -p test-results
      - run: pnpm test:api
      - run: pnpm test:integration
      - name: Print test report
        if: always()
        run: pnpm --filter @workspace/scripts run print-test-report -- api.xml integration.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            test-results/api.xml
            test-results/integration.xml
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - run: PORT=18150 BASE_PATH=/ pnpm --filter @workspace/landing run build
      - run: PORT=18151 BASE_PATH=/platform-admin/ pnpm --filter @workspace/platform-admin run build
      - name: Upload landing build
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: artifacts/landing/dist/public/
      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: artifacts/platform-admin/dist/public/
      - name: Upload api build
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: artifacts/api-server/dist/

  deploy:
    name: Deploy to rentrail.ru
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download landing build
        uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: dist/landing/
      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist/admin/
      - name: Download api build
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: dist/api/
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      - name: Pack and upload artifacts
        run: |
          tar czf /tmp/landing.tar.gz -C dist/landing .
          tar czf /tmp/admin.tar.gz -C dist/admin .
          tar czf /tmp/api.tar.gz -C dist/api .
          scp -i ~/.ssh/deploy_key /tmp/landing.tar.gz /tmp/admin.tar.gz /tmp/api.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          rm -rf /opt/rideflow/landing/*
          tar xzf /tmp/landing.tar.gz -C /opt/rideflow/landing/
          rm -rf /opt/rideflow/admin/*
          tar xzf /tmp/admin.tar.gz -C /opt/rideflow/admin/
          tar xzf /tmp/api.tar.gz -C /opt/rideflow/api/dist/
          pm2 restart rideflow-api
          rm /tmp/landing.tar.gz /tmp/admin.tar.gz /tmp/api.tar.gz
          echo "Deploy complete"
          ENDSSH

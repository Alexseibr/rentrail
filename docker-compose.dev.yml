version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: rentrail-postgres
    environment:
      POSTGRES_DB: rentrail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_rentrail:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentrail"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata_rentrail:
